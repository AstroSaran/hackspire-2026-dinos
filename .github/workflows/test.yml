name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements-live.txt
            backend/requirements-test.txt
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-live.txt -r backend/requirements-test.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the dependency auditor
        run: python -m pip install --upgrade pip-audit
      - name: Audit runtime and test dependencies
        run: pip-audit -r backend/requirements-live.txt -r backend/requirements-test.txt

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production API image
        run: docker build --tag kavach-api:ci .
