<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kavach — Sonarpur Live Pilot</title>
<style>body{font-family:Inter,system-ui,sans-serif;background:#0b1220;color:#e8eef7;margin:0;padding:32px}.card{max-width:900px;margin:auto;background:#111b2d;border:1px solid #26344d;border-radius:16px;padding:24px}h1{margin:0 0 6px}small,.muted{color:#9fb0c8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:20px 0}.metric{background:#0c1525;border-radius:12px;padding:16px}.metric b{display:block;font-size:28px;margin-top:6px}.live{color:#7ee787}.warn{color:#ffcc66}.bad{color:#ff7b72}button{background:#2f81f7;color:#fff;border:0;padding:10px 16px;border-radius:10px;cursor:pointer}.note{margin-top:18px;padding:14px;background:#18243a;border-radius:10px;line-height:1.5}pre{white-space:pre-wrap;word-break:break-word}</style></head>
<body><div class="card"><h1>Sonarpur Station Road — Live Pilot</h1><div class="muted">Mission Pally, Narendrapur, Rajpur Sonarpur, Kolkata – 700150, West Bengal</div>
<p id="status">Connecting to Kavach backend…</p><div id="metrics" class="grid"></div><div id="model" class="note"></div><div id="raw" class="note" style="display:none"></div><button onclick="loadLive()">Refresh live data</button></div>
<script>const API_BASE=(typeof window!=='undefined'&&window.KAVACH_API_BASE)||'http://localhost:8000';
async function loadLive(){const s=document.getElementById('status');s.textContent='Fetching live weather…';try{const r=await fetch(API_BASE+'/live-area/sonarpur');if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json(),w=d.weather||{};s.innerHTML='<span class="live">● Backend connected</span> · Provider: '+(w.provider_name||w.provider||'unknown')+' · Status: '+(w.status||'UNKNOWN');const vals=[['Temperature',w.temperature_c!=null?w.temperature_c+' °C':'—'],['Humidity',w.humidity_pct!=null?w.humidity_pct+' %':'—'],['Rainfall',w.precipitation_mm!=null?w.precipitation_mm+' mm':'—'],['Wind',w.wind_speed_kmh!=null?w.wind_speed_kmh+' km/h':'—'],['Observed',w.observed_at||'—'],['Fetched',w.fetched_at||'—']];document.getElementById('metrics').innerHTML=vals.map(x=>'<div class="metric"><span class="muted">'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');document.getElementById('model').innerHTML='<b>Livelihood model status:</b> '+d.model_assessment.status+'<br>'+d.model_assessment.reason+'<br><br><b>Missing live inputs:</b> '+d.model_assessment.missing_live_features.join(', ');document.getElementById('raw').style.display='block';document.getElementById('raw').innerHTML='<b>Raw response</b><pre>'+JSON.stringify(d,null,2)+'</pre>'}catch(e){s.innerHTML='<span class="bad">Live backend unavailable:</span> '+e.message+'<br><span class="muted">Start FastAPI on port 8000, then refresh.</span>';}}</nloadLive();</script></body></html>
